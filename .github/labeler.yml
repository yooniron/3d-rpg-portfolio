# GitHub Labeler Configuration (actions/labeler@v5)
# PR에서 변경된 파일 경로에 따라 Area 및 도메인 라벨을 자동으로 부착합니다.

'📦 area:frontend':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/components/ui/**'
          - 'src/App.jsx'
          - 'src/main.jsx'
          - 'src/index.css'
          - 'index.html'

'🎮 area:3d-world':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/components/3d/TownScene.jsx'
          - 'src/components/3d/Environment.jsx'

'🏛️ area:buildings':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/components/3d/buildings/**'

'🕹️ area:gameplay':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/components/3d/Player.jsx'
          - 'src/components/3d/TriggerZone.jsx'

'🏆 area:quest':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/data/careerData.js'
          - 'src/stores/useGameStore.js'

'🎵 area:audio':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/utils/soundEngine.js'

'🧪 test':
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/**'
          - 'src/**/*.test.*'

'📝 docs':
  - changed-files:
      - any-glob-to-any-file:
          - 'README.md'
          - 'GEMINI.md'
          - 'docs/**'
          - '*.md'

'⚙️ chore':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - '.agents/**'
          - '.editorconfig'
          - '.gitignore'
          - 'package.json'
          - 'package-lock.json'
          - 'vite.config.js'
